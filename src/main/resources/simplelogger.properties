# Keep Hibernate quiet so the narrated demo output stays readable.
org.slf4j.simpleLogger.defaultLogLevel=warn
# Log to stdout so log lines stay in order with the narrated output (stable run-output.txt diffs).
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
# HHH10001002 'built-in connection pool' warning is expected for a demo
org.slf4j.simpleLogger.log.org.hibernate.orm.connections.pooling=error
